<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Engine - Challenge Started</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .quiz-container {
            max-width: 800px;
            width: 95%;
            margin: auto;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .timer-bar {
            height: 6px;
            background: var(--accent-color);
            width: 100%;
            border-radius: 3px;
            transition: width 1s linear;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #f8fafc;
            text-align: left;
            padding: 18px 25px;
            margin-bottom: 12px;
            border-radius: 15px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            width: 100%;
            font-size: 1.1rem;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-color);
            transform: translateX(5px);
        }

        .option-btn.correct { background: #10b981 !important; border-color: #10b981 !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .option-btn.wrong { background: #ef4444 !important; border-color: #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .exit-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            font-size: 0.8rem;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .exit-btn:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-box" class="glass-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <span id="chapter-title" class="text-info small orbitron">CHAPTER NAME</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="question-count" class="badge bg-primary rounded-pill">Question 1/10</span>
                    <button class="exit-btn" onclick="confirmExit()">
                        <i class="bi bi-box-arrow-right me-1"></i> EXIT
                    </button>
                </div>
            </div>

            <div class="timer-container mb-4">
                <div class="timer-bar" id="timer"></div>
            </div>

            <h3 id="question-text" class="fw-bold mb-4">กำลังโหลดคำถาม...</h3>

            <div id="options-container">
                </div>
        </div>

        <div id="result-box" class="glass-card text-center d-none">
    <div id="result-icon" class="mb-3" style="font-size: 4rem;"></div>
    
    <h1 class="orbitron mb-2" style="background: linear-gradient(45deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        MISSION COMPLETE
    </h1>
    
    <div class="score-display my-4 p-4" style="background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px dashed var(--glass-border);">
        <h2 class="mb-1">Your Score</h2>
        <div class="display-3 fw-bold text-warning orbitron">
            <span id="final-score">0</span><span class="fs-4 text-white-50"> / <span id="total-questions">0</span></span>
        </div>
    </div>

    <div id="feedback-container" class="mb-4">
        <h4 id="feedback-status" class="fw-bold mb-2"></h4>
        <p id="feedback-text" class="text-white-50 px-3"></p>
    </div>

    <div class="d-flex gap-3 justify-content-center">
        <button class="btn btn-primary px-4 py-2 rounded-pill d-flex align-items-center" onclick="location.reload()" style="background: #38bdf8; border: none;">
            <i class="bi bi-arrow-clockwise me-2"></i> เล่นใหม่
        </button>
        <button class="btn btn-outline-light px-4 py-2 rounded-pill d-flex align-items-center" onclick="window.location.href='ICT24267.html'">
            <i class="bi bi-house-door me-2"></i> กลับหน้าหลัก
        </button>
    </div>
</div>
    </div>

    <script>
        let currentQuiz = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 10;
        let timerInterval;

        window.onload = function() {
            const data = sessionStorage.getItem('currentQuiz');
            const name = sessionStorage.getItem('chapterName');
            
            if (!data) {
                alert("ไม่พบข้อมูลคำถาม กรุณากลับไปเลือกบทเรียน");
                window.location.href = 'ICT24267.html';
                return;
            }

            // Parse ข้อมูลและสุ่มลำดับคำถามใหม่ทุกครั้งที่เริ่ม
            currentQuiz = JSON.parse(data).sort(() => Math.random() - 0.5);
            
            document.getElementById('chapter-title').innerText = name || 'QUIZ CHALLENGE';
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIndex >= currentQuiz.length) {
                showResult();
                return;
            }

            resetState();
            const q = currentQuiz[currentIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-count').innerText = `Question ${currentIndex + 1}/${currentQuiz.length}`;

            // สร้างตัวเลือกพร้อมเก็บสถานะคำตอบที่ถูกต้อง
            const options = q.options.map((opt, index) => ({ 
                text: opt, 
                isCorrect: index === q.answer 
            }));

            // สุ่มลำดับตัวเลือกเพื่อไม่ให้คำตอบอยู่ที่เดิม
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt.text}</span>`;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            const bar = document.getElementById('timer');
            bar.style.transition = 'none'; // รีเซ็ตแถบเป็น 100% ทันที
            bar.style.width = '100%';
            
            // บังคับให้เบราว์เซอร์วาดใหม่ก่อนเริ่ม Transition
            void bar.offsetWidth; 
            
            bar.style.transition = 'width 10s linear'; // ให้แถบค่อยๆ ลดลงใน 10 วินาที
            bar.style.width = '0%';
            
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSkip();
                }
            }, 1000);
        }

        function resetState() {
            clearInterval(timerInterval);
            document.getElementById('options-container').innerHTML = '';
            const bar = document.getElementById('timer');
            bar.style.transition = 'none';
            bar.style.width = '100%';
        }

        function selectOption(btn, isCorrect) {
            clearInterval(timerInterval);
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                // แสดงคำตอบที่ถูกให้เห็น
                btns.forEach(b => {
                    // ดึงเนื้อหาข้อความมาเช็คกับคำตอบที่ถูกดั้งเดิม
                    const originalAnswerText = currentQuiz[currentIndex].options[currentQuiz[currentIndex].answer];
                    if (b.innerText === originalAnswerText) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500); // เพิ่มเวลาให้ดูคำตอบเล็กน้อย
        }

        function autoSkip() {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);
            
            // แสดงเฉลยเมื่อหมดเวลา
            const originalAnswerText = currentQuiz[currentIndex].options[currentQuiz[currentIndex].answer];
            btns.forEach(b => {
                if (b.innerText === originalAnswerText) b.classList.add('correct');
            });

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1500);
        }

        function confirmExit() {
            clearInterval(timerInterval);
            if (confirm("ต้องการยกเลิกการทำแบบทดสอบและกลับไปหน้าหลักหรือไม่?")) {
                window.location.href = 'ICT24267.html';
            } else {
                // ถ้าไม่ยกเลิก ให้เริ่มนับเวลาต่อ (หรือโหลดข้อเดิมใหม่)
                const bar = document.getElementById('timer');
                bar.style.transition = `width ${timeLeft}s linear`;
                bar.style.width = '0%';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        autoSkip();
                    }
                }, 1000);
            }
        }

        function showResult() {
    document.getElementById('quiz-box').classList.add('d-none');
    document.getElementById('result-box').classList.remove('d-none');
    
    const finalScore = score;
    const total = currentQuiz.length;
    const percentage = (finalScore / total) * 100;

    document.getElementById('final-score').innerText = finalScore;
    document.getElementById('total-questions').innerText = total;

    const statusTitle = document.getElementById('feedback-status');
    const feedbackText = document.getElementById('feedback-text');
    const resultIcon = document.getElementById('result-icon');

    // ตรวจสอบคะแนนและแสดงข้อความ
    if (percentage >= 80) {
        statusTitle.innerText = "สุดยอดไปเลย! 🏆";
        statusTitle.className = "fw-bold mb-2 text-success";
        feedbackText.innerText = "คุณมีความเข้าใจในเนื้อหานี้ดีเยี่ยม รักษามาตรฐานนี้ไว้นะ!";
        resultIcon.innerHTML = "✨";
    } else if (percentage >= 50) {
        statusTitle.innerText = "ผ่านเกณฑ์! 👍";
        statusTitle.className = "fw-bold mb-2 text-info";
        feedbackText.innerText = "ทำได้ดีแล้วครับ ลองทบทวนอีกนิดเพื่อคะแนนที่เต็มเปี่ยม!";
        resultIcon.innerHTML = "😊";
    } else {
        statusTitle.innerText = "พยายามอีกนิดนะ! ✌️";
        statusTitle.className = "fw-bold mb-2 text-warning";
        feedbackText.innerText = "ไม่เป็นไรนะ ความผิดพลาดคือการเรียนรู้ ลองอ่านทบทวนใหม่อีกรอบ แล้วกลับมาคว้าคะแนนเต็มให้ได้!";
        resultIcon.innerHTML = "☕";
    }
}
    </script>
</body>
</html>
