<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPU Ultimate Quiz Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .hero-section {
            padding: 80px 0 50px;
            text-align: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Course Card Styling */
        .course-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }

        .course-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .course-card:hover::before {
            opacity: 1;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            color: var(--accent-color);
        }

        .btn-play {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s;
        }

        .btn-play:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transform: scale(1.05);
        }

        /* Stats Badge */
        .stats-pill {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .coming-soon {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="hero-section">
            <h1 class="brand-title mb-3">SPU QUIZ MASTER</h1>
            <p class="text-secondary lead">ปลดล็อกความรู้ ท้าทายคะแนนสูงสุด กับบทเรียน ICT แบบ Interactive</p>
            <div class="mt-4">
                <span class="stats-pill"><i class="bi bi-people-fill me-2"></i>สำหรับนักศึกษา ICT ศรีปทุม</span>
            </div>
        </header>

        <div class="row g-4 justify-content-center pb-5">
            
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card course-card h-100 p-4" onclick="location.href='ICT24267.html'">
                    <div class="card-body text-center">
                        <div class="icon-box">
                            <i class="bi bi-cloud-haze2-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-1 text-light">ICT24267</h4>
                        <h3 class="fw-bold mb-3 text-light">การประมวลผลคลาวด์</h3>
                        <p class="text-light mb-4">ตะลุยโลก Cloud Computing ทั้ง 13     บทเรียน สู่ระดับมืออาชีพ</p>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4 px-3">
                            <span class="small text-info"><i class="bi bi-controller me-1"></i> 110 ข้อ</span>
                            <span class="small text-warning"><i class="bi bi-star-fill me-1"></i> Level: Beginner</span>
                        </div>
                        
                        <button class="btn btn-play w-100">
                            เริ่มท้าทาย <i class="bi bi-arrow-right-short ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card course-card h-100 p-4" onclick="location.href='security_game.html'">
                    <div class="card-body text-center">
                        <div class="icon-box">
                            <i class="bi bi-cloud-haze2-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-1 text-light">Security Game</h4>
                        <!-- <h3 class="fw-bold mb-3 text-light">การประมวลผลคลาวด์</h3> -->
                        <!-- <p class="text-light mb-4">ตะลุยโลก Cloud Computing ทั้ง 13     บทเรียน สู่ระดับมืออาชีพ</p>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4 px-3">
                            <span class="small text-info"><i class="bi bi-controller me-1"></i> 110 ข้อ</span> -->
                            <span class="small text-warning"><i class="bi bi-star-fill me-1"></i> Level: Beginner</span>
                        </div>
                        
                        <button class="btn btn-play w-100">
                            เริ่มเกม <i class="bi bi-arrow-right-short ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>

                <div class="card course-card h-100 p-4 coming-soon">
                    <div class="card-body text-center">
                        <div class="icon-box">
                            <i class="bi bi-code-slash"></i>
                        </div>
                        <h4 class="fw-bold mb-1 text-secondary">ICT301</h4>
                        <h3 class="fw-bold mb-3 text-secondary">Web Development</h3>
                        <p class="text-secondary mb-4">ยกระดับการเขียนเว็บด้วย Django & SQL Server (เร็วๆ นี้)</p>
                        <button class="btn btn-secondary w-100" disabled>Coming Soon</button>
                    </div>
                </div>
            </div> -->

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
