<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro - Dark Edition</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --border-dark: #334155;
            --email-white: #ffffff;
            --text-gray: #94a3b8;
        }

        body { 
            background-color: var(--dark-bg); 
            color: #f1f5f9; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar Custom */
        .navbar { background-color: var(--dark-card) !important; border-bottom: 1px solid var(--border-dark); }

        /* Main Layout */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }

        /* Column 1: Narrative (Dark) */
        .narrative-col { 
            width: 300px; 
            background: var(--dark-card); 
            border-right: 1px solid var(--border-dark); 
            padding: 2rem; 
        }
        .npc-box { background: var(--dark-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border-dark); }

        /* Column 2: Inbox (White) */
        .inbox-col { 
            width: 320px; 
            background: var(--email-white); 
            color: #1e293b;
            border-right: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: column; 
        }
        .email-item { padding: 1rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s; }
        .email-item:hover { background-color: #f8fafc; }
        .email-item.active { background-color: #eff6ff; border-left: 4px solid #0d6efd; }
        .email-item.unread { font-weight: bold; }

        /* Column 3: View (Gray BG with White Card) */
        .view-col { 
            flex: 1; 
            background: var(--dark-bg); 
            display: flex; 
            flex-direction: column; 
            padding: 20px;
        }

        .email-container {
            background: var(--email-white);
            color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .email-toolbar { 
            background: #ffffff; 
            border-bottom: 1px solid #e2e8f0; 
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email-content-scroll { padding: 40px; overflow-y: auto; flex: 1; }

        /* Highlights */
        .red-flag-highlight { 
            background-color: #fff3cd; 
            border: 2px dashed #ffc107; 
            padding: 2px 4px; 
            border-radius: 4px;
        }

        .btn-decorative { color: #94a3b8; pointer-events: none; opacity: 0.5; }
        
        /* Modal Custom */
        .modal-content { border: none; border-radius: 15px; }
    </style>
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-dark px-4 py-2">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock-fill text-primary"></i> PhishGuard Simulator</span>
    <div class="text-white">
        <span class="fs-5 fw-bold">Score: <span id="score-display" class="badge bg-primary">0</span></span>
    </div>
</nav>

<div class="main-wrapper">
    
    <!-- Col 1: Narrative (Dark Sidebar) -->
    <div class="narrative-col">
        <div class="text-center mb-4">
            <div style="font-size: 4rem;">🦖</div>
            <h5 class="mt-2 fw-bold text-white">INTJ Scientist Rex</h5>
            <span class="badge bg-secondary">System Mentor</span>
        </div>
        <div class="npc-box">
            <p id="instruction-text" class="small mb-0 text-gray">
                "เตรียมตัวให้พร้อม... ผมกำลังจำลองการโจมตีเข้ามาในระบบของคุณ อย่าหลงกลล่ะ"
            </p>
        </div>
        <div id="status-update" class="mt-4 text-center text-primary fw-bold"></div>
    </div>

    <!-- Col 2: Inbox (Light Middle) -->
    <div class="inbox-col">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <span class="fw-bold">Inbox</span>
            <span class="badge bg-light text-dark border">2 Messages</span>
        </div>
        <div id="email-list-container" class="overflow-auto">
            <div class="email-item">
                <div class="d-flex justify-content-between">
                    <span class="small fw-bold text-truncate">ยินดีต้อนรับสู่ระบบ</span>
                    <span class="text-muted small">10:00</span>
                </div>
                <div class="small text-muted text-truncate">Admin Team</div>
            </div>
        </div>
    </div>

    <!-- Col 3: Email View (Right Side) -->
    <div class="view-col">
        <div class="email-container">
            <!-- Toolbar -->
            <div class="email-toolbar">
                <button id="btn-report" class="btn btn-warning btn-sm d-none" onclick="handleAction('report')">
                    <i class="bi bi-flag-fill"></i> รายงาน Phishing
                </button>
                <button id="btn-delete" class="btn btn-outline-danger btn-sm d-none" onclick="handleAction('delete')">
                    <i class="bi bi-trash"></i> ลบเมล
                </button>
                <div style="width: 1px; height: 20px; background: #ddd; margin: 0 5px;"></div>
                <i class="bi bi-reply btn-decorative ms-2"></i>
                <i class="bi bi-forward btn-decorative ms-3"></i>
                <i class="bi bi-printer btn-decorative ms-3"></i>
            </div>

            <!-- Content Area -->
            <div id="email-content-area" class="email-content-scroll">
                <div class="text-center text-muted mt-5">
                    <i class="bi bi-envelope-paper display-1 opacity-25"></i>
                    <p class="mt-3">กรุณาเลือกอีเมลเพื่อเริ่มตรวจสอบ</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Analysis (Success/Warning) -->
<div class="modal fade" id="analysisModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header text-white" id="modal-header">
                <h5 class="modal-title" id="modal-title">วิเคราะห์ความปลอดภัย</h5>
            </div>
            <div class="modal-body p-4">
                <div class="text-center mb-4" id="modal-icon" style="font-size: 3rem;"></div>
                <h4 id="analysis-feedback" class="text-center fw-bold mb-4"></h4>
                <div class="alert alert-light border">
                    <h6 class="fw-bold text-dark"><i class="bi bi-lightbulb-fill text-warning"></i> จุดสังเกตที่คุณควรระวัง:</h6>
                    <ul id="red-flags-list" class="mt-3"></ul>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-dark w-100 py-2" onclick="location.reload()">ลองใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let score = 0;
    const modal = new bootstrap.Modal(document.getElementById('analysisModal'));

    // ตั้งเวลา 5 วินาที เมลเข้า
    let timeLeft = 5;
    const timer = setInterval(() => {
        timeLeft--;
        document.getElementById('status-update').innerText = `เมลทดสอบจะเข้าใน ${timeLeft}...`;
        if(timeLeft <= 0) {
            clearInterval(timer);
            document.getElementById('status-update').innerText = "📩 ได้รับเมลใหม่!";
            showPhishingEmail();
        }
    }, 1000);

    function showPhishingEmail() {
        const list = document.getElementById('email-list-container');
        const item = document.createElement('div');
        item.className = 'email-item unread active';
        item.innerHTML = `
            <div class="d-flex justify-content-between">
                <span class="small fw-bold text-danger">⚠️ แจ้งเปลี่ยนรหัสผ่านด่วน</span>
                <span class="text-primary small">Now</span>
            </div>
            <div class="small text-muted">IT-Security &lt;admin@verify-company.net&gt;</div>
        `;
        item.onclick = loadContent;
        list.prepend(item);
        document.getElementById('instruction-text').innerText = "ตรวจพบอีเมลต้องสงสัย! ใช้ทักษะของคุณวิเคราะห์จุดผิดปกติให้เจอ";
    }

    function loadContent() {
        document.getElementById('btn-report').classList.remove('d-none');
        document.getElementById('btn-delete').classList.remove('d-none');
        
        const area = document.getElementById('email-content-area');
        area.innerHTML = `
            <div class="mb-4">
                <h2 class="fw-bold">⚠️ ยืนยันการเปลี่ยนรหัสผ่านของคุณ</h2>
                <p class="text-muted mb-0">จาก: <b>IT-Security</b> &lt;admin@verify-company.net&gt;</p>
                <p class="text-muted small">ถึง: คุณ (user@my-company.com)</p>
            </div>
            <hr>
            <div style="font-size: 1.1rem; line-height: 1.8;">
                <p>เรียนผู้ใช้งาน,</p>
                <p>เราพบ <span id="f1">การเข้าใช้บัญชีของคุณจากรัสเซีย</span> หากไม่ใช่การกระทำของคุณ บัญชีของคุณอาจตกอยู่ในอันตราย</p>
                <p>กรุณาคลิกที่ลิงก์ด้านล่างเพื่อทำการ <b>"ยกเลิกการเปลี่ยนรหัสผ่าน"</b> และตรวจสอบความปลอดภัยทันที:</p>
                
                <div class="text-center my-4">
                    <a href="javascript:void(0)" class="btn btn-danger px-5 py-3 fw-bold" onclick="handleAction('click-link')" id="f2">
                        คลิกเพื่อยกเลิกและตรวจสอบบัญชี (Security Check)
                    </a>
                </div>

                <p class="text-muted" style="font-size: 0.9rem;">*หากไม่ดำเนินการภายใน 5 นาที <span id="f3">ระบบจะทำการล็อกบัญชีและลบข้อมูลถาวร</span></p>
            </div>
        `;
    }

    function handleAction(type) {
        const title = document.getElementById('modal-title');
        const header = document.getElementById('modal-header');
        const feedback = document.getElementById('analysis-feedback');
        const list = document.getElementById('red-flags-list');
        const icon = document.getElementById('modal-icon');
        list.innerHTML = "";

        if(type === 'report') {
            score += 100;
            header.className = "modal-header bg-success";
            icon.innerText = "✅";
            feedback.innerHTML = "ยอดเยี่ยม! คุณรายงานได้ถูกต้อง";
        } else if(type === 'delete') {
            score -= 20;
            header.className = "modal-header bg-warning";
            icon.innerText = "🗑️";
            feedback.innerHTML = "ปลอดภัยแต่ยังไม่ดีที่สุด! คุณลบเมลแล้ว แต่ควร 'รายงาน' เพื่อป้องกันผู้อื่น";
        } else {
            score -= 100; // หักคะแนนหนักกรณีคลิกลิงก์
            header.className = "modal-header bg-danger";
            icon.innerText = "💀";
            feedback.innerHTML = "คุณถูกโจมตีแล้ว! การคลิกลิงก์คือจุดประสงค์ของแฮกเกอร์";
        }

        const flags = [
            "<b>Email Domain ปลอม:</b> สังเกต '@verify-company.net' ซึ่งไม่ใช่โดเมนหลักของบริษัทคุณ",
            "<b>สร้างความกลัว (Fear):</b> แฮกเกอร์อ้างเรื่องการล็อกอินจากรัสเซียและขู่ลบข้อมูลเพื่อบีบให้คุณตกใจ",
            "<b>ลิงก์อันตราย:</b> ปุ่มสีแดงสดดึงดูดให้คุณคลิกโดยไม่เช็ค URL จริง"
        ];

        flags.forEach(f => {
            const li = document.createElement('li');
            li.className = "mb-2 text-dark";
            li.innerHTML = f;
            list.appendChild(li);
        });

        // Highlight Red Flags
        document.getElementById('f1').classList.add('red-flag-highlight');
        document.getElementById('f2').classList.add('red-flag-highlight');
        document.getElementById('f3').classList.add('red-flag-highlight');

        document.getElementById('score-display').innerText = score;
        modal.show();
    }
</script>

</body>
</html>
