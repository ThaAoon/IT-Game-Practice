<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Exam - Cloud Computing Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #f59e0b; /* เปลี่ยนเป็นสีส้มทองให้ดูเป็นทางการ */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
        }

        .quiz-container { max-width: 850px; width: 95%; margin: auto; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .timer-bar {
            height: 8px;
            background: var(--accent-color);
            width: 100%;
            border-radius: 4px;
            transition: width 1s linear;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #f8fafc;
            text-align: left;
            padding: 20px 25px;
            margin-bottom: 12px;
            border-radius: 15px;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--accent-color);
            transform: translateX(8px);
        }

        .option-btn.correct { background: #10b981 !important; border-color: #10b981 !important; }
        .option-btn.wrong { background: #ef4444 !important; border-color: #ef4444 !important; }
        
        .orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-box" class="glass-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-warning small orbitron"><i class="bi bi-shield-lock-fill me-2"></i>FINAL EXAM MODE</span>
                <div class="d-flex align-items-center gap-3">
                    <span id="question-count" class="badge bg-warning text-dark rounded-pill">Question 1/40</span>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="confirmExit()">ยกเลิก</button>
                </div>
            </div>

            <div class="timer-container mb-4">
                <div class="timer-bar" id="timer"></div>
            </div>

            <h3 id="question-text" class="fw-bold mb-4">กำลังจัดเตรียมข้อสอบรวมทุกบท...</h3>
            <div id="options-container"></div>
        </div>

        <div id="result-box" class="glass-card text-center d-none">
            <div id="result-icon" class="mb-3" style="font-size: 5rem;">🏆</div>
            <h1 class="orbitron text-warning mb-4">EXAM FINISHED</h1>
            <h2 class="mb-4">คะแนนรวม: <span id="final-score" class="display-4 fw-bold">0</span> / 40</h2>
            <p id="feedback-text" class="text-secondary mb-5"></p>
            
            <div class="d-flex gap-3 justify-content-center">
                <button class="btn btn-warning px-5 py-3 rounded-pill fw-bold" onclick="location.reload()">สอบใหม่อีกครั้ง</button>
                <button class="btn btn-outline-light px-5 py-3 rounded-pill" onclick="window.location.href='ICT24267.html'">กลับหน้าหลัก</button>
            </div>
        </div>
    </div>

    <script>
        // ฟังก์ชันนี้จะดึง quizData จากหน้าหลักมาใช้ (ในกรณีที่รันผ่านระบบเดียวกัน)
        // หรือดึงจาก sessionStorage ที่เราจะส่งมาจากหน้า ICT24267.html
        let examQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 10;
        let timerInterval;

        window.onload = function() {
            const data = sessionStorage.getItem('finalExamPool');
            if (!data) {
                alert("กรุณาเริ่มสอบผ่านหน้าเลือกบทเรียน เพื่อทำการสุ่มข้อสอบ");
                window.location.href = 'ICT24267.html';
                return;
            }
            examQuestions = JSON.parse(data);
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIndex >= examQuestions.length) {
                showResult();
                return;
            }

            resetState();
            const q = examQuestions[currentIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-count').innerText = `Question ${currentIndex + 1}/${examQuestions.length}`;

            // สุ่มตัวเลือก
            const options = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt.text}</span>`;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            const bar = document.getElementById('timer');
            bar.style.width = '100%';
            timerInterval = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft * 10) + '%';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    currentIndex++;
                    loadQuestion();
                }
            }, 1000);
        }

        function selectOption(btn, isCorrect) {
            clearInterval(timerInterval);
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1000);
        }

        function resetState() {
            clearInterval(timerInterval);
            document.getElementById('options-container').innerHTML = '';
        }

        function confirmExit() {
            if (confirm("คุณต้องการออกจากการสอบหรือไม่? คะแนนปัจจุบันจะไม่ถูกบันทึก")) {
                window.location.href = 'ICT24267.html';
            }
        }

        function showResult() {
            document.getElementById('quiz-box').classList.add('d-none');
            document.getElementById('result-box').classList.remove('d-none');
            document.getElementById('final-score').innerText = score;
            
            const feedback = document.getElementById('feedback-text');
            if(score >= 32) feedback.innerText = "เยี่ยมยอด! คุณพร้อมสำหรับการสอบจริงแล้ว";
            else if(score >= 20) feedback.innerText = "ผ่านเกณฑ์มาตรฐาน แต่ลองทบทวนบทที่ไม่ถนัดเพิ่มนะ";
            else feedback.innerText = "พยายามอีกนิด ลองกลับไปทบทวนเนื้อหารายบทอีกครั้งครับ";
        }
    </script>
</body>
</html>
